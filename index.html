---
layout: default
title: Home
---
<h2>Posts</h2>
<ul class="post-list">
  {% for post in site.posts %}
  <li>
    <span class="date">{{ post.date | date: "%B %-d, %Y" }}</span><br>
    <a class="title" href="{{ post.url | prepend: site.baseurl }}">{{ post.title }}</a>
    {% if post.excerpt %}<p>{{ post.excerpt | strip_html | truncatewords: 30 }}</p>{% endif %}
  </li>
  {% endfor %}
</ul>
