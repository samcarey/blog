<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <script>
    (function () {
      var stored = localStorage.getItem('theme');
      var pref = (stored === 'light' || stored === 'dark' || stored === 'system') ? stored : 'system';
      var resolved = pref === 'system'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : pref;
      document.documentElement.setAttribute('data-theme', resolved);
      document.documentElement.setAttribute('data-theme-pref', pref);
    })();
  </script>
  <style>
    :root {
      --bg: #ffffff;
      --text: #222222;
      --muted: #888888;
      --nav: #555555;
      --nav-hover: #000000;
      --border: #dddddd;
      --link: #0055aa;
      --toggle-bg: #f2f2f2;
      --toggle-active-bg: #ffffff;
      --toggle-active-shadow: rgba(0, 0, 0, 0.12);
    }
    [data-theme="dark"] {
      --bg: #15171a;
      --text: #e6e6e6;
      --muted: #8a8f98;
      --nav: #b0b4bb;
      --nav-hover: #ffffff;
      --border: #2a2d31;
      --link: #6fb3ff;
      --toggle-bg: #22252a;
      --toggle-active-bg: #34383f;
      --toggle-active-shadow: rgba(0, 0, 0, 0.5);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
      max-width: 680px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }
    header { margin-bottom: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
    header a { color: inherit; text-decoration: none; }
    header h1 { font-size: 1.5rem; }
    .header-row { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    nav a { color: var(--nav); font-size: 0.9rem; text-decoration: none; margin-right: 1rem; }
    nav a:hover { color: var(--nav-hover); }
    main { margin-bottom: 3rem; }
    h1, h2, h3 { margin: 1.5rem 0 0.5rem; }
    h1 { font-size: 1.8rem; }
    p { margin-bottom: 1rem; }
    ul, ol { margin: 0 0 1rem 1.5rem; }
    a { color: var(--link); }
    .post-list { list-style: none; padding: 0; }
    .post-list li { margin-bottom: 1.5rem; }
    .post-list .title { font-size: 1.2rem; }
    .post-list .date { color: var(--muted); font-size: 0.85rem; }
    .post-meta { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
    footer { border-top: 1px solid var(--border); padding-top: 1rem; color: var(--muted); font-size: 0.8rem; }
    .draft-badge {
      background: #f0ad4e;
      color: #fff;
      font-size: 0.7rem;
      padding: 0.15rem 0.4rem;
      border-radius: 3px;
      vertical-align: middle;
      text-transform: uppercase;
      font-weight: bold;
    }
    .theme-toggle {
      display: inline-flex;
      background: var(--toggle-bg);
      border-radius: 999px;
      padding: 2px;
      gap: 2px;
    }
    .theme-toggle button {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--nav);
      padding: 0.3rem 0.5rem;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .theme-toggle button svg {
      width: 16px;
      height: 16px;
      display: block;
    }
    .theme-toggle button:hover { color: var(--nav-hover); }
    .theme-toggle button[aria-pressed="true"] {
      background: var(--toggle-active-bg);
      color: var(--text);
      box-shadow: 0 1px 2px var(--toggle-active-shadow);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-row">
      <h1><a href="{{ site.baseurl }}/">{{ site.title }}</a></h1>
      <div class="theme-toggle" role="group" aria-label="Theme">
        <button type="button" data-theme-set="light" aria-pressed="false" aria-label="Light theme" title="Light">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
        </button>
        <button type="button" data-theme-set="system" aria-pressed="false" aria-label="System theme" title="System">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="4" width="20" height="14" rx="2"/>
            <path d="M8 22h8M12 18v4"/>
          </svg>
        </button>
        <button type="button" data-theme-set="dark" aria-pressed="false" aria-label="Dark theme" title="Dark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </div>
    <nav>
      <a href="{{ site.baseurl }}/">Posts</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer>
    &copy; {{ 'now' | date: "%Y" }}
  </footer>
  <script>
    (function () {
      var root = document.documentElement;
      var media = window.matchMedia('(prefers-color-scheme: dark)');

      function apply(pref) {
        var resolved = pref === 'system' ? (media.matches ? 'dark' : 'light') : pref;
        root.setAttribute('data-theme', resolved);
        root.setAttribute('data-theme-pref', pref);
        document.querySelectorAll('.theme-toggle button').forEach(function (b) {
          b.setAttribute('aria-pressed', b.dataset.themeSet === pref ? 'true' : 'false');
        });
      }

      var stored = localStorage.getItem('theme');
      var initial = (stored === 'light' || stored === 'dark' || stored === 'system') ? stored : 'system';
      apply(initial);

      document.querySelectorAll('.theme-toggle button').forEach(function (b) {
        b.addEventListener('click', function () {
          var pref = b.dataset.themeSet;
          localStorage.setItem('theme', pref);
          apply(pref);
        });
      });

      media.addEventListener('change', function () {
        if ((localStorage.getItem('theme') || 'system') === 'system') apply('system');
      });
    })();
  </script>
</body>
</html>
